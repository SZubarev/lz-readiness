AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager with rotation for PCI-DSS applications'

Parameters:
  SecretName:
    Type: String
    Description: Name of the secret (e.g., contoso/prod/db/password)
  DatabaseEndpoint:
    Type: String
    Description: RDS database endpoint
  DatabasePort:
    Type: Number
    Default: 5432

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: !Sub 'Database credentials for ${SecretName}'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      KmsKeyId: alias/aws/secretsmanager
      Tags:
        - Key: contoso:data-classification
          Value: confidential
        - Key: contoso:compliance
          Value: pci-dss

  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref DatabaseSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: 90

  RotationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${SecretName}-rotation'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt RotationLambdaRole.Arn
      Environment:
        Variables:
          DB_ENDPOINT: !Ref DatabaseEndpoint
          DB_PORT: !Ref DatabasePort
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              # Implement rotation logic
              return {'statusCode': 200}

  RotationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretsManagerRotation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                Resource: !Ref DatabaseSecret

Outputs:
  SecretArn:
    Value: !Ref DatabaseSecret