AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager for centralized secrets storage with automatic rotation'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, dev]
    Description: Environment name

Resources:
  # RDS Master Password Secret
  RDSMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/rds/master-password'
      Description: RDS master password with automatic rotation
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Secrets Manager VPC Endpoint for private access
  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !ImportValue NetworkStack-VpcId
      SubnetIds:
        - !ImportValue NetworkStack-PrivateSubnet1
        - !ImportValue NetworkStack-PrivateSubnet2
      SecurityGroupIds:
        - !Ref SecretsManagerSecurityGroup

  SecretsManagerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Secrets Manager VPC Endpoint
      VpcId: !ImportValue NetworkStack-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/8
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-secretsmanager-vpce-sg'

  # IAM Role for Lambda rotation function
  SecretsRotationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerRotation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                Resource: !Ref RDSMasterSecret

Outputs:
  SecretArn:
    Description: ARN of the RDS master password secret
    Value: !Ref RDSMasterSecret
    Export:
      Name: !Sub '${Environment}-RDSMasterSecretArn'