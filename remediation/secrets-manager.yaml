AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Secrets Manager setup for application secrets

Parameters:
  RotationLambdaArn:
    Type: String
    Description: ARN of Lambda function for secret rotation (optional)
    Default: ''

Conditions:
  HasRotation: !Not [!Equals [!Ref RotationLambdaArn, '']]

Resources:
  SecretsManagerKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Secrets Manager encryption
      KeyPolicy:
        Statement:
          - Sid: Enable IAM policies
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Secrets Manager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-database-credentials'
      Description: Database credentials with automatic rotation
      KmsKeyId: !Ref SecretsManagerKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: HasRotation
    Properties:
      SecretId: !Ref DatabaseSecret
      RotationLambdaARN: !Ref RotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: 30

Outputs:
  SecretArn:
    Description: Secret ARN
    Value: !Ref DatabaseSecret
  KmsKeyId:
    Description: KMS Key for Secrets
    Value: !Ref SecretsManagerKmsKey
