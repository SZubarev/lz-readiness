AWSTemplateFormatVersion: '2010-09-09'
Description: 'SSM Patch Manager baseline with automated patching schedule'

Parameters:
  MaintenanceWindowDay:
    Type: String
    Description: 'Day of week for maintenance window'
    Default: 'SUN'
    AllowedValues:
      - 'MON'
      - 'TUE'
      - 'WED'
      - 'THU'
      - 'FRI'
      - 'SAT'
      - 'SUN'
  
  MaintenanceWindowStartHour:
    Type: Number
    Description: 'Start hour (24h format UTC)'
    Default: 2
    MinValue: 0
    MaxValue: 23

Resources:
  # Patch baseline for Linux
  LinuxPatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Name: 'contoso-linux-baseline'
      Description: 'Patch baseline for RHEL and Amazon Linux'
      OperatingSystem: AMAZON_LINUX_2
      ApprovalRules:
        PatchRules:
          - ApproveAfterDays: 7
            ComplianceLevel: CRITICAL
            PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - Security
                - Key: SEVERITY
                  Values:
                    - Critical
          - ApproveAfterDays: 14
            ComplianceLevel: HIGH
            PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - Security
                    - Bugfix

  # Patch baseline for Windows
  WindowsPatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Name: 'contoso-windows-baseline'
      Description: 'Patch baseline for Windows Server'
      OperatingSystem: WINDOWS
      ApprovalRules:
        PatchRules:
          - ApproveAfterDays: 7
            ComplianceLevel: CRITICAL
            PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - SecurityUpdates
                    - CriticalUpdates
                - Key: MSRC_SEVERITY
                  Values:
                    - Critical
          - ApproveAfterDays: 14
            ComplianceLevel: HIGH
            PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - SecurityUpdates
                    - Updates

  # Maintenance window
  PatchMaintenanceWindow:
    Type: AWS::SSM::MaintenanceWindow
    Properties:
      Name: 'contoso-patch-window'
      Description: 'Weekly patching maintenance window'
      Schedule: !Sub 'cron(0 ${MaintenanceWindowStartHour} ? * ${MaintenanceWindowDay} *)'
      Duration: 4
      Cutoff: 1
      AllowUnassociatedTargets: false

  # Maintenance window target (all managed instances)
  PatchTarget:
    Type: AWS::SSM::MaintenanceWindowTarget
    Properties:
      WindowId: !Ref PatchMaintenanceWindow
      ResourceType: INSTANCE
      Targets:
        - Key: tag:environment
          Values:
            - production
            - staging

  # Patch task
  PatchTask:
    Type: AWS::SSM::MaintenanceWindowTask
    Properties:
      WindowId: !Ref PatchMaintenanceWindow
      Targets:
        - Key: WindowTargetIds
          Values:
            - !Ref PatchTarget
      TaskType: RUN_COMMAND
      ServiceRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ssm.amazonaws.com/AWSServiceRoleForAmazonSSM'
      TaskArn: 'AWS-RunPatchBaseline'
      TaskInvocationParameters:
        MaintenanceWindowRunCommandParameters:
          Parameters:
            Operation:
              - Install
      Priority: 1
      MaxConcurrency: '10%'
      MaxErrors: '5%'

Outputs:
  MaintenanceWindowId:
    Description: 'Patch maintenance window ID'
    Value: !Ref PatchMaintenanceWindow
