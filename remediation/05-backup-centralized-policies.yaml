AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Backup centralized policies with 35-day operational + 7-year archival retention'

Parameters:
  OperationalRetentionDays:
    Type: Number
    Description: 'Operational backup retention (days)'
    Default: 35
  
  ArchivalRetentionYears:
    Type: Number
    Description: 'Archival backup retention (years)'
    Default: 7

Resources:
  # Backup vault with KMS encryption
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: 'contoso-backup-vault'
      EncryptionKeyArn: !GetAtt BackupVaultKey.Arn

  # KMS key for backup encryption
  BackupVaultKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for AWS Backup vault encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM policies
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow AWS Backup
            Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action:
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

  # Backup plan with operational + archival tiers
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: 'contoso-backup-plan'
        BackupPlanRule:
          - RuleName: 'daily-operational-backups'
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 3 * * ? *)'
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              DeleteAfterDays: !Ref OperationalRetentionDays
            RecoveryPointTags:
              retention-type: operational
            CopyActions:
              - DestinationBackupVaultArn: !Sub 'arn:aws:backup:us-west-2:${AWS::AccountId}:backup-vault:contoso-backup-vault-dr'
                Lifecycle:
                  DeleteAfterDays: !Ref OperationalRetentionDays
          - RuleName: 'monthly-archival-backups'
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 3 1 * ? *)'
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              MoveToColdStorageAfterDays: 30
              DeleteAfterDays: !Ref 'AWS::NoValue'
            RecoveryPointTags:
              retention-type: archival
              retention-years: !Ref ArchivalRetentionYears

  # Backup selection for RDS databases
  RDSBackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: 'rds-databases'
        IamRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/service-role/AWSBackupDefaultServiceRole'
        Resources:
          - !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*'
        Conditions:
          StringEquals:
            - ConditionKey: 'aws:ResourceTag/backup-enabled'
              ConditionValue: 'true'

Outputs:
  BackupVaultArn:
    Description: 'ARN of the backup vault'
    Value: !GetAtt BackupVault.BackupVaultArn
  
  BackupPlanId:
    Description: 'ID of the backup plan'
    Value: !Ref BackupPlan
