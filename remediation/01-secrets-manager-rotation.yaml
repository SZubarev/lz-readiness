AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager with automated rotation for application credentials'

Parameters:
  SecretName:
    Type: String
    Description: 'Name for the secret (e.g., app/database/connection)'
    Default: 'app/database/credentials'
  
  RotationDays:
    Type: Number
    Description: 'Number of days between automatic secret rotations'
    Default: 90
    MinValue: 1
    MaxValue: 365

Resources:
  ApplicationSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Ref SecretName
      Description: 'Application database credentials with automatic rotation'
      SecretString: !Sub |
        {
          "username": "admin",
          "password": "${AWS::StackName}-initial-password",
          "engine": "mysql",
          "host": "database.internal.contoso.com",
          "port": 3306,
          "dbname": "application"
        }
      Tags:
        - Key: 'contoso:environment'
          Value: 'production'
        - Key: 'contoso:data-classification'
          Value: 'confidential'
        - Key: 'contoso:owner'
          Value: 'platform-team'

  SecretRotationSchedule:
    Type: 'AWS::SecretsManager::RotationSchedule'
    Properties:
      SecretId: !Ref ApplicationSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: !Ref RotationDays

  RotationLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: SecretsManagerRotation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:DescribeSecret'
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:PutSecretValue'
                  - 'secretsmanager:UpdateSecretVersionStage'
                Resource: !Ref ApplicationSecret

  RotationLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: !Sub '${AWS::StackName}-rotation'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt RotationLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          def handler(event, context):
              # Rotation logic placeholder
              return {'statusCode': 200}

Outputs:
  SecretArn:
    Description: 'ARN of the created secret'
    Value: !Ref ApplicationSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'