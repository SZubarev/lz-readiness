AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager with 90-day automated rotation for application credentials'

Parameters:
  ApplicationName:
    Type: String
    Description: 'Application name for secret naming'
    Default: 'contoso-app'
  
  RotationDays:
    Type: Number
    Description: 'Number of days between automatic rotation'
    Default: 90
    MinValue: 1
    MaxValue: 365

Resources:
  # Lambda execution role for rotation
  SecretRotationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-secrets-rotation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: SecretsManagerRotation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:DescribeSecret'
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:PutSecretValue'
                  - 'secretsmanager:UpdateSecretVersionStage'
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApplicationName}/*'

  # RDS database credentials secret
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ApplicationName}/database/credentials'
      Description: !Sub 'RDS credentials for ${ApplicationName}'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: application-id
          Value: !Ref ApplicationName
        - Key: data-classification
          Value: 'confidential'

  # Rotation schedule
  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: DatabaseSecret
    Properties:
      SecretId: !Ref DatabaseSecret
      RotationRules:
        AutomaticallyAfterDays: !Ref RotationDays

Outputs:
  SecretArn:
    Description: 'ARN of the database credentials secret'
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${ApplicationName}-secret-arn'
  
  RotationLambdaRoleArn:
    Description: 'IAM role for rotation Lambda'
    Value: !GetAtt SecretRotationLambdaRole.Arn
