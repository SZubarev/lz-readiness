AWSTemplateFormatVersion: '2010-09-09'
Description: 'Automated Cost Optimization - Rightsizes non-production EC2 instances based on utilization'

Parameters:
  CpuUtilizationThreshold:
    Type: Number
    Default: 20
    Description: CPU utilization threshold for rightsizing recommendation
  EvaluationPeriodDays:
    Type: Number
    Default: 14
    Description: Days to analyze before making recommendations
  AutoApprovalThreshold:
    Type: Number
    Default: 100
    Description: Monthly savings threshold for auto-approval (USD)

Resources:
  CostOptimizationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: CostOptimizationAutomation
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Automated cost optimization workflow",
          "StartAt": "AnalyzeInstances",
          "States": {
            "AnalyzeInstances": {
              "Type": "Task",
              "Resource": "${CostAnalysisFunction.Arn}",
              "Next": "CheckSavingsThreshold"
            },
            "CheckSavingsThreshold": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.estimatedMonthlySavings",
                  "NumericGreaterThan": ${AutoApprovalThreshold},
                  "Next": "RequestApproval"
                }
              ],
              "Default": "ApplyOptimizations"
            },
            "RequestApproval": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
              "Parameters": {
                "TopicArn": "${ApprovalTopic}",
                "Subject": "Cost Optimization Approval Required",
                "Message.$": "$"
              },
              "Next": "ApplyOptimizations"
            },
            "ApplyOptimizations": {
              "Type": "Task",
              "Resource": "${OptimizationFunction.Arn}",
              "Next": "SendCompletionNotification"
            },
            "SendCompletionNotification": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${CompletionTopic}",
                "Subject": "Cost Optimization Complete",
                "Message.$": "$.summary"
              },
              "End": true
            }
          }
        }

  CostAnalysisFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CostOptimizationAnalyzer
      Runtime: python3.11
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          CPU_THRESHOLD: !Ref CpuUtilizationThreshold
          EVALUATION_DAYS: !Ref EvaluationPeriodDays
      Code:
        ZipFile: |
          import boto3
          import os
          from datetime import datetime, timedelta
          
          ec2 = boto3.client('ec2')
          cloudwatch = boto3.client('cloudwatch')
          compute_optimizer = boto3.client('compute-optimizer')
          
          def handler(event, context):
              cpu_threshold = float(os.environ['CPU_THRESHOLD'])
              evaluation_days = int(os.environ['EVALUATION_DAYS'])
              
              # Get all non-production instances
              instances = get_nonprod_instances()
              recommendations = []
              total_savings = 0
              
              for instance in instances:
                  instance_id = instance['InstanceId']
                  current_type = instance['InstanceType']
                  
                  # Get CPU utilization
                  avg_cpu = get_avg_cpu(instance_id, evaluation_days)
                  
                  # Get Compute Optimizer recommendation
                  recommendation = get_recommendation(instance_id)
                  
                  if avg_cpu < cpu_threshold and recommendation:
                      recommended_type = recommendation['recommendedInstanceType']
                      estimated_savings = recommendation['estimatedMonthlySavings']
                      
                      recommendations.append({
                          'instanceId': instance_id,
                          'currentType': current_type,
                          'recommendedType': recommended_type,
                          'avgCpu': avg_cpu,
                          'estimatedMonthlySavings': estimated_savings
                      })
                      total_savings += estimated_savings
              
              return {
                  'recommendations': recommendations,
                  'estimatedMonthlySavings': total_savings,
                  'instanceCount': len(recommendations)
              }
          
          def get_nonprod_instances():
              response = ec2.describe_instances(
                  Filters=[
                      {'Name': 'tag:Environment', 'Values': ['dev', 'test', 'staging']},
                      {'Name': 'instance-state-name', 'Values': ['running']}
                  ]
              )
              instances = []
              for reservation in response['Reservations']:
                  instances.extend(reservation['Instances'])
              return instances
          
          def get_avg_cpu(instance_id, days):
              end_time = datetime.utcnow()
              start_time = end_time - timedelta(days=days)
              
              response = cloudwatch.get_metric_statistics(
                  Namespace='AWS/EC2',
                  MetricName='CPUUtilization',
                  Dimensions=[{'Name': 'InstanceId', 'Value': instance_id}],
                  StartTime=start_time,
                  EndTime=end_time,
                  Period=86400,
                  Statistics=['Average']
              )
              
              if response['Datapoints']:
                  return sum(d['Average'] for d in response['Datapoints']) / len(response['Datapoints'])
              return 0
          
          def get_recommendation(instance_id):
              try:
                  response = compute_optimizer.get_ec2_instance_recommendations(
                      instanceArns=[f"arn:aws:ec2:*:*:instance/{instance_id}"]
                  )
                  if response['instanceRecommendations']:
                      rec = response['instanceRecommendations'][0]
                      if rec['recommendationOptions']:
                          option = rec['recommendationOptions'][0]
                          return {
                              'recommendedInstanceType': option['instanceType'],
                              'estimatedMonthlySavings': option.get('savingsOpportunity', {}).get('estimatedMonthlySavings', {}).get('value', 0)
                          }
              except:
                  pass
              return None

  OptimizationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CostOptimizationExecutor
      Runtime: python3.11
      Handler: index.handler
      Timeout: 600
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          
          ec2 = boto3.client('ec2')
          
          def handler(event, context):
              recommendations = event['recommendations']
              results = []
              
              for rec in recommendations:
                  instance_id = rec['instanceId']
                  new_type = rec['recommendedType']
                  
                  try:
                      # Stop instance
                      ec2.stop_instances(InstanceIds=[instance_id])
                      waiter = ec2.get_waiter('instance_stopped')
                      waiter.wait(InstanceIds=[instance_id])
                      
                      # Change instance type
                      ec2.modify_instance_attribute(
                          InstanceId=instance_id,
                          InstanceType={'Value': new_type}
                      )
                      
                      # Start instance
                      ec2.start_instances(InstanceIds=[instance_id])
                      
                      results.append({
                          'instanceId': instance_id,
                          'status': 'SUCCESS',
                          'newType': new_type
                      })
                  except Exception as e:
                      results.append({
                          'instanceId': instance_id,
                          'status': 'FAILED',
                          'error': str(e)
                      })
              
              return {
                  'results': results,
                  'summary': f"Optimized {len([r for r in results if r['status']=='SUCCESS'])} of {len(recommendations)} instances"
              }

  EventBridgeSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: WeeklyCostOptimization
      Description: Runs cost optimization analysis weekly
      ScheduleExpression: 'rate(7 days)'
      State: ENABLED
      Targets:
        - Arn: !Ref CostOptimizationStateMachine
          Id: CostOptimizationTarget
          RoleArn: !GetAtt EventBridgeRole.Arn

  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: CostOptimizationApprovals
      DisplayName: Cost Optimization Approval Requests

  CompletionTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: CostOptimizationResults
      DisplayName: Cost Optimization Completion Notifications

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - sns:Publish
                Resource: '*'

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CostOptimizationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:ModifyInstanceAttribute
                  - cloudwatch:GetMetricStatistics
                  - compute-optimizer:GetEC2InstanceRecommendations
                Resource: '*'

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref CostOptimizationStateMachine

Outputs:
  StateMachineArn:
    Value: !Ref CostOptimizationStateMachine
    Description: ARN of the cost optimization state machine
  ApprovalTopicArn:
    Value: !Ref ApprovalTopic
    Description: SNS topic for approval requests