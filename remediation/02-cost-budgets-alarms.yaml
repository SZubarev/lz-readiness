AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Budgets with threshold alerts and Cost Anomaly Detection'

Parameters:
  MonthlyBudgetLimit:
    Type: Number
    Description: 'Monthly budget limit in USD'
    Default: 10000
  
  AlertEmail:
    Type: String
    Description: 'Email address for budget alerts'
    Default: 'finops@contoso.com'

Resources:
  # SNS topic for cost alerts
  CostAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: 'contoso-cost-alerts'
      DisplayName: 'Contoso Cost Alerts'
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # Monthly budget with multiple thresholds
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: 'contoso-monthly-budget'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
        CostFilters:
          TagKeyValue:
            - 'user:business-unit$contoso'
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 75
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 90
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertTopic

  # Cost Anomaly Detection Monitor
  CostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: 'contoso-cost-anomaly-monitor'
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  # Cost Anomaly Subscription
  CostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: 'contoso-anomaly-alerts'
      Frequency: DAILY
      MonitorArnList:
        - !GetAtt CostAnomalyMonitor.MonitorArn
      Subscribers:
        - Type: SNS
          Address: !Ref CostAlertTopic
      Threshold: 100

Outputs:
  BudgetName:
    Description: 'Name of the monthly budget'
    Value: 'contoso-monthly-budget'
  
  AlertTopicArn:
    Description: 'SNS topic ARN for cost alerts'
    Value: !Ref CostAlertTopic
