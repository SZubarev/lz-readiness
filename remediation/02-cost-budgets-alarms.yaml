AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Budgets with anomaly detection and SNS alerting for cost governance'

Parameters:
  MonthlyBudgetAmount:
    Type: Number
    Description: 'Monthly budget amount in USD'
    Default: 50000
  
  AlertEmail:
    Type: String
    Description: 'Email address for budget alerts'
    Default: 'finops@contoso.com'

Resources:
  BudgetAlertTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      TopicName: 'contoso-cost-alerts'
      DisplayName: 'Contoso Cost Budget Alerts'
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  MonthlyBudget:
    Type: 'AWS::Budgets::Budget'
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-budget'
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          TagKeyValue:
            - 'user:contoso:environment$production'
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 75
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 90
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

  CostAnomalyMonitor:
    Type: 'AWS::CE::AnomalyMonitor'
    Properties:
      MonitorName: !Sub '${AWS::StackName}-anomaly-monitor'
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  CostAnomalySubscription:
    Type: 'AWS::CE::AnomalySubscription'
    Properties:
      SubscriptionName: !Sub '${AWS::StackName}-anomaly-subscription'
      Threshold: 100
      Frequency: DAILY
      MonitorArnList:
        - !GetAtt CostAnomalyMonitor.MonitorArn
      Subscribers:
        - Type: SNS
          Address: !Ref BudgetAlertTopic

Outputs:
  BudgetTopicArn:
    Description: 'SNS Topic ARN for budget alerts'
    Value: !Ref BudgetAlertTopic