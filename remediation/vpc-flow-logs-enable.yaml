AWSTemplateFormatVersion: '2010-09-09'
Description: 'LZ Readiness Remediation - Enable VPC Flow Logs for all VPCs'

Parameters:
  RetentionInDays:
    Type: Number
    Default: 365
    Description: 'CloudWatch Logs retention for VPC Flow Logs (PCI-DSS requires 1 year)'
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vpc/flowlogs
      RetentionInDays: !Ref RetentionInDays

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VPCFlowLogsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsLogGroup.Arn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceIds:
        - !Ref AWS::NoValue  # Replace with actual VPC IDs
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: compliance_scope
          Value: pci-dss
        - Key: Purpose
          Value: NetworkMonitoring

Outputs:
  LogGroupArn:
    Description: CloudWatch Log Group ARN for VPC Flow Logs
    Value: !GetAtt FlowLogsLogGroup.Arn
    Export:
      Name: VPCFlowLogsLogGroupArn