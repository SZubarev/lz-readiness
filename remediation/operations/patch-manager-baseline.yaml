AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Systems Manager Patch Manager baseline'

Resources:
  PatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Name: production-patch-baseline
      Description: Baseline for production systems
      OperatingSystem: AMAZON_LINUX_2
      ApprovalRules:
        PatchRules:
          - PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - Security
                    - Bugfix
                - Key: SEVERITY
                  Values:
                    - Critical
                    - Important
            ApproveAfterDays: 7
            ComplianceLevel: HIGH

  MaintenanceWindow:
    Type: AWS::SSM::MaintenanceWindow
    Properties:
      Name: patch-maintenance-window
      Description: Weekly patching window
      Schedule: 'cron(0 2 ? * SUN *)'
      Duration: 4
      Cutoff: 1
      AllowUnassociatedTargets: false

  MaintenanceWindowTarget:
    Type: AWS::SSM::MaintenanceWindowTarget
    Properties:
      WindowId: !Ref MaintenanceWindow
      ResourceType: INSTANCE
      Targets:
        - Key: tag:Environment
          Values:
            - production

  PatchTask:
    Type: AWS::SSM::MaintenanceWindowTask
    Properties:
      WindowId: !Ref MaintenanceWindow
      Targets:
        - Key: WindowTargetIds
          Values:
            - !Ref MaintenanceWindowTarget
      TaskArn: AWS-RunPatchBaseline
      ServiceRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ssm.amazonaws.com/AWSServiceRoleForAmazonSSM'
      TaskType: RUN_COMMAND
      Priority: 1
      MaxConcurrency: '10%'
      MaxErrors: '10%'

Outputs:
  PatchBaselineId:
    Value: !Ref PatchBaseline
