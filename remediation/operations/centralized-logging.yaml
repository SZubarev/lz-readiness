AWSTemplateFormatVersion: '2010-09-09'
Description: 'Centralized CloudWatch Logs with cross-account access'

Resources:
  CentralLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/centralized/application-logs
      RetentionInDays: 90

  LogDestination:
    Type: AWS::Logs::Destination
    Properties:
      DestinationName: CentralizedLoggingDestination
      TargetArn: !GetAtt CentralLogGroup.Arn
      DestinationPolicy: |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"AWS": "*"},
            "Action": "logs:PutLogEvents",
            "Resource": "*"
          }]
        }

  LogMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CentralLogGroup
      FilterPattern: '[ERROR]'
      MetricTransformations:
        - MetricName: ApplicationErrors
          MetricNamespace: CustomMetrics
          MetricValue: '1'

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: high-error-rate
      MetricName: ApplicationErrors
      Namespace: CustomMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold

Outputs:
  LogGroupName:
    Value: !Ref CentralLogGroup
