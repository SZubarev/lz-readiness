AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Backup vault with vault lock for immutability'

Parameters:
  VaultName:
    Type: String
    Default: contoso-backup-vault
    Description: Name of the backup vault
  KmsKeyArn:
    Type: String
    Description: KMS CMK ARN for backup encryption

Resources:
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Ref VaultName
      EncryptionKeyArn: !Ref KmsKeyArn
      BackupVaultTags:
        contoso:environment: production
        contoso:data-classification: confidential

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: contoso-daily-backup
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 5 * * ? *)'
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              DeleteAfterDays: 35
              MoveToColdStorageAfterDays: 7
            CopyActions:
              - DestinationBackupVaultArn: !Sub 'arn:aws:backup:us-west-2:${AWS::AccountId}:backup-vault:${VaultName}'
                Lifecycle:
                  DeleteAfterDays: 35

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: AllRdsInstances
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - 'arn:aws:rds:*:*:db:*'

Outputs:
  BackupVaultArn:
    Value: !GetAtt BackupVault.BackupVaultArn