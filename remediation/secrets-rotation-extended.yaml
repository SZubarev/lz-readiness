AWSTemplateFormatVersion: '2010-09-09'
Description: 'Extended Secrets Rotation - Automates rotation for OAuth tokens and service accounts'

Parameters:
  RotationIntervalDays:
    Type: Number
    Default: 90
    Description: Days between secret rotations

Resources:
  OAuthTokenRotationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: OAuthTokenRotation
      Runtime: python3.11
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt RotationLambdaRole.Arn
      Environment:
        Variables:
          SECRETS_MANAGER_ENDPOINT: !Sub 'https://secretsmanager.${AWS::Region}.amazonaws.com'
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          
          secretsmanager = boto3.client('secretsmanager')
          
          def handler(event, context):
              secret_arn = event['SecretId']
              token = event['Token']
              step = event['Step']
              
              if step == 'createSecret':
                  create_secret(secret_arn, token)
              elif step == 'setSecret':
                  set_secret(secret_arn, token)
              elif step == 'testSecret':
                  test_secret(secret_arn, token)
              elif step == 'finishSecret':
                  finish_secret(secret_arn, token)
              
              return {'statusCode': 200}
          
          def create_secret(secret_arn, token):
              # Get current secret
              current = secretsmanager.get_secret_value(
                  SecretId=secret_arn,
                  VersionStage='AWSCURRENT'
              )
              current_dict = json.loads(current['SecretString'])
              
              # Generate new OAuth token by calling token endpoint
              new_token = refresh_oauth_token(current_dict)
              
              # Store new version
              secretsmanager.put_secret_value(
                  SecretId=secret_arn,
                  ClientRequestToken=token,
                  SecretString=json.dumps(new_token),
                  VersionStages=['AWSPENDING']
              )
          
          def set_secret(secret_arn, token):
              # For OAuth tokens, no additional setup needed
              pass
          
          def test_secret(secret_arn, token):
              # Test new token by making API call
              pending = secretsmanager.get_secret_value(
                  SecretId=secret_arn,
                  VersionId=token,
                  VersionStage='AWSPENDING'
              )
              token_dict = json.loads(pending['SecretString'])
              validate_oauth_token(token_dict)
          
          def finish_secret(secret_arn, token):
              # Move AWSCURRENT to AWSPREVIOUS
              metadata = secretsmanager.describe_secret(SecretId=secret_arn)
              for version in metadata['VersionIdsToStages']:
                  if 'AWSCURRENT' in metadata['VersionIdsToStages'][version]:
                      secretsmanager.update_secret_version_stage(
                          SecretId=secret_arn,
                          VersionStage='AWSCURRENT',
                          MoveToVersionId=token,
                          RemoveFromVersionId=version
                      )
                      break
          
          def refresh_oauth_token(current_secret):
              # Placeholder - implement OAuth refresh flow
              return {
                  'access_token': 'new_access_token',
                  'refresh_token': current_secret.get('refresh_token'),
                  'expires_in': 3600
              }
          
          def validate_oauth_token(token_dict):
              # Placeholder - implement token validation
              pass

  ServiceAccountRotationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ServiceAccountRotation
      Runtime: python3.11
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt RotationLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import secrets
          import string
          
          secretsmanager = boto3.client('secretsmanager')
          iam = boto3.client('iam')
          
          def handler(event, context):
              secret_arn = event['SecretId']
              token = event['Token']
              step = event['Step']
              
              if step == 'createSecret':
                  create_secret(secret_arn, token)
              elif step == 'setSecret':
                  set_secret(secret_arn, token)
              elif step == 'testSecret':
                  test_secret(secret_arn, token)
              elif step == 'finishSecret':
                  finish_secret(secret_arn, token)
              
              return {'statusCode': 200}
          
          def create_secret(secret_arn, token):
              # Generate new password
              alphabet = string.ascii_letters + string.digits + '!@#$%^&*'
              new_password = ''.join(secrets.choice(alphabet) for _ in range(32))
              
              # Get current secret metadata
              current = secretsmanager.get_secret_value(
                  SecretId=secret_arn,
                  VersionStage='AWSCURRENT'
              )
              current_dict = json.loads(current['SecretString'])
              username = current_dict['username']
              
              # Store new version
              secretsmanager.put_secret_value(
                  SecretId=secret_arn,
                  ClientRequestToken=token,
                  SecretString=json.dumps({
                      'username': username,
                      'password': new_password
                  }),
                  VersionStages=['AWSPENDING']
              )
          
          def set_secret(secret_arn, token):
              # Update IAM user password
              pending = secretsmanager.get_secret_value(
                  SecretId=secret_arn,
                  VersionId=token,
                  VersionStage='AWSPENDING'
              )
              creds = json.loads(pending['SecretString'])
              
              iam.update_login_profile(
                  UserName=creds['username'],
                  Password=creds['password'],
                  PasswordResetRequired=False
              )
          
          def test_secret(secret_arn, token):
              # Validate new credentials
              pending = secretsmanager.get_secret_value(
                  SecretId=secret_arn,
                  VersionId=token,
                  VersionStage='AWSPENDING'
              )
              creds = json.loads(pending['SecretString'])
              # Test authentication
              pass
          
          def finish_secret(secret_arn, token):
              metadata = secretsmanager.describe_secret(SecretId=secret_arn)
              for version in metadata['VersionIdsToStages']:
                  if 'AWSCURRENT' in metadata['VersionIdsToStages'][version]:
                      secretsmanager.update_secret_version_stage(
                          SecretId=secret_arn,
                          VersionStage='AWSCURRENT',
                          MoveToVersionId=token,
                          RemoveFromVersionId=version
                      )
                      break

  RotationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretRotationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:UpdateLoginProfile
                  - iam:GetUser
                Resource: '*'

  RotationScheduleOAuth:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref OAuthSecretPlaceholder
      RotationLambdaARN: !GetAtt OAuthTokenRotationFunction.Arn
      RotationRules:
        AutomaticallyAfterDays: !Ref RotationIntervalDays

  OAuthSecretPlaceholder:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: oauth-token-template
      Description: Template for OAuth token secrets with automatic rotation
      SecretString: '{"access_token":"","refresh_token":"","expires_in":0}'

Outputs:
  OAuthRotationFunctionArn:
    Value: !GetAtt OAuthTokenRotationFunction.Arn
    Description: ARN of OAuth token rotation function
  ServiceAccountRotationFunctionArn:
    Value: !GetAtt ServiceAccountRotationFunction.Arn
    Description: ARN of service account rotation function