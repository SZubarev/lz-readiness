AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager for RDS credential rotation'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  DatabaseEngine:
    Type: String
    AllowedValues: [postgres, mysql, oracle, sqlserver]
    Default: postgres
  RDSInstanceIdentifier:
    Type: String
    Description: RDS instance identifier for credential rotation

Resources:
  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'contoso/${Environment}/rds/${DatabaseEngine}/${RDSInstanceIdentifier}'
      Description: !Sub 'RDS ${DatabaseEngine} credentials for ${RDSInstanceIdentifier}'
      KmsKeyId: !Ref SecretsKMSKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DatabaseEngine
          Value: !Ref DatabaseEngine

  SecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Secrets Manager encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Secrets Manager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref RDSSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: 90

  RotationLambda:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref RDSSecret
      RotationLambdaARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SecretsManagerRDSPostgreSQLRotation'
      RotationRules:
        AutomaticallyAfterDays: 90

Outputs:
  SecretArn:
    Description: Secrets Manager secret ARN
    Value: !Ref RDSSecret
  SecretName:
    Description: Secret name for application retrieval
    Value: !Sub 'contoso/${Environment}/rds/${DatabaseEngine}/${RDSInstanceIdentifier}'
