AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Secrets Manager with automatic rotation for RDS credentials

Parameters:
  DatabaseName:
    Type: String
    Description: Name of the RDS database
  RotationSchedule:
    Type: Number
    Default: 30
    Description: Rotation schedule in days

Resources:
  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${DatabaseName}-credentials'
      Description: !Sub 'RDS credentials for ${DatabaseName}'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref RDSSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: !Ref RotationSchedule

  RotationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite

  RotationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${DatabaseName}-rotation'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt RotationLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          def handler(event, context):
              # Rotation logic placeholder
              return {'statusCode': 200}

Outputs:
  SecretArn:
    Description: Secret ARN for RDS credentials
    Value: !Ref RDSSecret