AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager with automatic rotation for database credentials'

Parameters:
  DatabaseEngine:
    Type: String
    Default: postgres
    AllowedValues: [postgres, mysql, oracle, sqlserver]
    Description: Database engine type
  
  RotationScheduleDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Days between automatic rotations

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-db-credentials'
      Description: Database master credentials with automatic rotation
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: data-classification
          Value: restricted
        - Key: auto-rotation
          Value: enabled

  RotationLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite

  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref DatabaseSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: !Ref RotationScheduleDays

  RotationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-rotation-function'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt RotationLambdaExecutionRole.Arn
      Environment:
        Variables:
          SECRET_ARN: !Ref DatabaseSecret
      Code:
        ZipFile: |
          import boto3
          import json
          def handler(event, context):
              # Rotation logic placeholder
              return {'statusCode': 200}

Outputs:
  SecretArn:
    Description: ARN of the secret
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'