AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Cost Anomaly Detection and Budget Alerts

Parameters:
  MonthlyBudget:
    Type: Number
    Default: 100000
    Description: Monthly budget threshold in USD

Resources:
  CostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: cost-anomaly-monitor
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  CostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: cost-anomaly-alerts
      Threshold: 100
      Frequency: DAILY
      MonitorArnList:
        - !GetAtt CostAnomalyMonitor.MonitorArn
      Subscribers:
        - Type: SNS
          Address: !Ref CostAlertsSNSTopic

  CostAlertsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cost-anomaly-alerts
      DisplayName: Cost Anomaly Alerts

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: monthly-cloud-spend
        BudgetLimit:
          Amount: !Ref MonthlyBudget
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsSNSTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsSNSTopic

Outputs:
  AnomalyMonitorArn:
    Description: Cost Anomaly Monitor ARN
    Value: !GetAtt CostAnomalyMonitor.MonitorArn
  SNSTopicArn:
    Description: SNS Topic for cost alerts
    Value: !Ref CostAlertsSNSTopic