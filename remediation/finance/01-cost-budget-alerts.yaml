AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Budgets with cost alerts and SNS notifications'

Parameters:
  MonthlyBudgetAmount:
    Type: Number
    Default: 50000
    Description: Monthly budget amount in USD
  AlertEmail:
    Type: String
    Description: Email address for budget alerts

Resources:
  BudgetAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: AWS Budget Alerts
      TopicName: budget-alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: monthly-overall-budget
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters: {}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

Outputs:
  BudgetName:
    Description: Name of the budget
    Value: monthly-overall-budget
  SNSTopicArn:
    Description: SNS Topic for budget alerts
    Value: !Ref BudgetAlertTopic