AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager with RDS password rotation for Landing Zone'

Parameters:
  DatabaseIdentifier:
    Type: String
    Description: 'RDS database identifier for secret association'
    Default: 'postgres-prod-01'

Resources:
  # KMS key for Secrets Manager encryption
  SecretsKMSKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: 'KMS key for Secrets Manager encryption'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: 'Allow Secrets Manager'
            Effect: 'Allow'
            Principal:
              Service: 'secretsmanager.amazonaws.com'
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'
      EnableKeyRotation: true

  # RDS database password secret
  DatabaseSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub '${DatabaseIdentifier}-credentials'
      Description: 'RDS database credentials with automatic rotation'
      KmsKeyId: !Ref SecretsKMSKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "dbadmin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  # Rotation Lambda execution role
  RotationLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: 'SecretsManagerRotation'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:DescribeSecret'
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:PutSecretValue'
                  - 'secretsmanager:UpdateSecretVersionStage'
                Resource: !Ref DatabaseSecret
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetRandomPassword'
                Resource: '*'

  # Secret rotation schedule (90 days)
  SecretRotationSchedule:
    Type: 'AWS::SecretsManager::RotationSchedule'
    DependsOn: RotationLambdaRole
    Properties:
      SecretId: !Ref DatabaseSecret
      RotationLambdaARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SecretsManagerRDSRotation'
      RotationRules:
        AutomaticallyAfterDays: 90

Outputs:
  SecretArn:
    Description: 'ARN of the database secret'
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'
  KMSKeyId:
    Description: 'KMS key ID for Secrets Manager'
    Value: !Ref SecretsKMSKey
    Export:
      Name: !Sub '${AWS::StackName}-KMSKeyId'
