AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploy AWS Secrets Manager across all accounts with automatic rotation'

Resources:
  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPCId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      SecurityGroupIds:
        - !Ref SecretsManagerSG

  SecretsManagerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for Secrets Manager VPC endpoint'
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/8
      Tags:
        - Key: Name
          Value: secrets-manager-endpoint-sg

  RDSSecretRotationLambda:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref RDSDatabaseSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: 30

  RDSDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'RDS database master credentials'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      KmsKeyId: !Ref SecretsKMSKey

  SecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for Secrets Manager encryption'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM policies
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Secrets Manager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

Parameters:
  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for Secrets Manager endpoint
  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet3:
    Type: AWS::EC2::Subnet::Id

Outputs:
  SecretArn:
    Value: !Ref RDSDatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'
